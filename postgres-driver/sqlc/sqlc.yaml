version: "2"
overrides:
  go:
    rename:
      application_ids: "ApplicationIDs"
      chain_ids: "ChainIDs"
      account_ids: "AccountIDs"
      portal_application_ids: "PortalApplicationIDs"
      favorited_chain_ids: "FavoritedChainIDs"
      partner_chain_ids: "PartnerChainIDs"
      provider_user_ids: "ProviderUserIDs"
      url: "URL"
      urls: "URLs"
      evm_chain_id: "EVMChainID"
      aats: "AATs"
      covalent_api_key_free: "CovalentAPIKeyFree"
      covalent_api_key_paid: "CovalentAPIKeyPaid"
      aat_id: "AATID"

sql:
  - schema: "schema.sql"
    engine: "postgresql"
    queries: "query.sql"
    gen:
      go:
        package: "postgresdriver"
        out: ".."
        emit_json_tags: true
        output_db_file_name: db.generated.go
        output_models_file_name: models.generated.go
        output_querier_file_name: querier.generated.go
        output_files_suffix: .generated
        overrides:
          #  Enum Overrides
          - db_type: "auth_provider"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.AuthProvider"
          - db_type: "auth_type"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.AuthType"
          - db_type: "chain_auth_type"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.ChainAuthType"
          - db_type: "chain_check_type"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.ChainCheckType"
          - db_type: "environment"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.Environment"
          - db_type: "notification_event"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.NotificationEvent"
          - db_type: "notification_type"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.NotificationType"
          - db_type: "permissions"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.Permissions"
          - db_type: "whitelist_type"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.WhitelistType"
          - db_type: "account_user_access"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.AccountUserAccess"
          # ID type Overrides
          - column: "portal_applications.id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.PortalAppID"
          - column: "aats.id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.ProtocolAppID"
          - column: "gigastake_applications.aat_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.ProtocolAppID"
          - column: "aats.portal_application_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.PortalAppID"
          - column: "portal_application_settings.application_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.PortalAppID"
          - column: "portal_application_whitelists.application_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.PortalAppID"
          - column: "portal_application_notifications.application_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.PortalAppID"
          - column: "portal_applications.plan_type"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.PayPlanType"
          - column: "pay_plans.plan_type"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.PayPlanType"
          - column: "accounts.id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.AccountID"
          - column: "accounts.owner_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.UserID"
          - column: "accounts.plan_type"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.PayPlanType"
          - column: "account_integrations.account_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.AccountID"
          - column: "account_user_access.portal_application_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.PortalAppID"
          - column: "account_user_access.user_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.UserID"
          - column: "account_user_access.role_name"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.RoleName"
          - column: "users.id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.UserID"
          - column: "users.email"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.Email"
          - column: "user_auth_providers.user_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.UserID"
          - column: "user_auth_providers.type"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.AuthType"
          - column: "user_auth_providers.provider"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.AuthProvider"
          - column: "user_auth_providers.provider_user_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.ProviderUserID"
          - column: "chains.id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.RelayChainID"
          - column: "chain_altruists.chain_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.RelayChainID"
          - column: "chain_altruists.url"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.AltruistURL"
          - column: "chain_gigastake_redirects.chain_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.RelayChainID"
          - column: "chain_checks.chain_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.RelayChainID"
          - column: "chain_gigastake_redirects.portal_application_id"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.PortalAppID"
          - column: "chain_gigastake_redirects.domain"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.RedirectDomain"
          - column: "global_blocked_contracts.blocked_address"
            go_type: "github.com/pokt-foundation/portal-db/v2/types.BlockedAddress"
