version: "2"
overrides:
  go:
    rename:
      application_ids: "ApplicationIDs"
      chain_ids: "ChainIDs"
      favorited_chain_ids: "FavoritedChainIDs"
      partner_chain_ids: "PartnerChainIDs"
      provider_user_ids: "ProviderUserIDs"

sql:
  - schema: "schema.sql"
    engine: "postgresql"
    queries: "query.sql"
    gen:
      go:
        package: "postgresdriver"
        out: ".."
        json_tags_case_style: camel
        emit_json_tags: true
        output_db_file_name: db.generated.go
        output_models_file_name: models.generated.go
        output_querier_file_name: querier.generated.go
        output_files_suffix: .generated
        overrides:
          #  Enum Overrides
          - db_type: "auth_provider"
            go_type: "github.com/pokt-foundation/portal-db/types.AuthProvider"
          - db_type: "auth_type"
            go_type: "github.com/pokt-foundation/portal-db/types.AuthType"
          - db_type: "chain_auth_type"
            go_type: "github.com/pokt-foundation/portal-db/types.ChainAuthType"
          - db_type: "chain_check_type"
            go_type: "github.com/pokt-foundation/portal-db/types.ChainCheckType"
          - db_type: "environment"
            go_type: "github.com/pokt-foundation/portal-db/types.Environment"
          - db_type: "notification_event"
            go_type: "github.com/pokt-foundation/portal-db/types.NotificationEvent"
          - db_type: "notification_type"
            go_type: "github.com/pokt-foundation/portal-db/types.NotificationType"
          - db_type: "permissions"
            go_type: "github.com/pokt-foundation/portal-db/types.Permissions"
          - db_type: "whitelist_type"
            go_type: "github.com/pokt-foundation/portal-db/types.WhitelistType"
          - db_type: "account_user_access"
            go_type: "github.com/pokt-foundation/portal-db/types.AccountUserAccess"
          # ID type Overrides
          - column: "portal_applications.id"
            go_type: "github.com/pokt-foundation/portal-db/types.PortalAppID"
          - column: "portal_application_aats.application_id"
            go_type: "github.com/pokt-foundation/portal-db/types.PortalAppID"
          - column: "portal_application_settings.application_id"
            go_type: "github.com/pokt-foundation/portal-db/types.PortalAppID"
          - column: "portal_application_whitelists.application_id"
            go_type: "github.com/pokt-foundation/portal-db/types.PortalAppID"
          - column: "portal_application_notifications.application_id"
            go_type: "github.com/pokt-foundation/portal-db/types.PortalAppID"
          - column: "accounts.id"
            go_type: "github.com/pokt-foundation/portal-db/types.AccountID"
          - column: "accounts.plan_type"
            go_type: "github.com/pokt-foundation/portal-db/types.PayPlanType"
          - column: "account_user_access.account_id"
            go_type: "github.com/pokt-foundation/portal-db/types.AccountID"
          - column: "account_user_access.user_id"
            go_type: "github.com/pokt-foundation/portal-db/types.UserID"
          - column: "account_user_access.role_name"
            go_type: "github.com/pokt-foundation/portal-db/types.RoleName"
          - column: "users.id"
            go_type: "github.com/pokt-foundation/portal-db/types.UserID"
          - column: "users.email"
            go_type: "github.com/pokt-foundation/portal-db/types.Email"
          - column: "user_auth_providers.user_id"
            go_type: "github.com/pokt-foundation/portal-db/types.UserID"
          - column: "user_auth_providers.type"
            go_type: "github.com/pokt-foundation/portal-db/types.AuthType"
          - column: "user_auth_providers.provider"
            go_type: "github.com/pokt-foundation/portal-db/types.AuthProvider"

          # legacy table
          - column: "stickiness_options.lb_id"
            go_type: "github.com/pokt-foundation/portal-db/types.PortalAppID"
